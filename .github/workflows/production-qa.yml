name: Production QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  production-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Source build / pre-deploy gate
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Probe production URL
        id: probe
        shell: bash
        run: |
          code=$(curl -L -s -o /dev/null -w "%{http_code}" https://tasksk018.vercel.app || true)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then echo "live=true" >> "$GITHUB_OUTPUT"; else echo "live=false" >> "$GITHUB_OUTPUT"; fi
      - name: Waiting for manual Vercel
        if: steps.probe.outputs.live != 'true'
        run: echo "Canonical production URL is not live yet; release approval remains pending."
      - name: Check exact-commit Vercel status
        if: steps.probe.outputs.live == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, urllib.request, os
          u='https://api.github.com/repos/${{ github.repository }}/deployments?sha='+os.environ['SHA']
          try:
            data=json.load(urllib.request.urlopen(u)); print('deployments',len(data))
          except Exception as e: print('deployment metadata unavailable',e)
          PY
      - name: Run multi-viewport production QA
        if: steps.probe.outputs.live == 'true'
        env:
          PRODUCTION_URL: https://tasksk018.vercel.app
        run: npm run qa:production
      - name: Upload QA evidence
        if: always() && steps.probe.outputs.live == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-qa-${{ github.sha }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
